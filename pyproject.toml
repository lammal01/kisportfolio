[project]
name = "kis-ai-trading-agent"
version = "0.1.0"
description = "AI agent that observes KIS market data, decides BUY/SELL/HOLD, and only executes orders that pass an independent risk manager."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.31",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["agents*", "broker*", "market*", "risk*", "telegram*", "memory*", "models*", "config*"]
